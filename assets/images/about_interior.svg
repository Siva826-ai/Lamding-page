<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <!-- Warm Ambient Interior Lighting Gradient -->
    <linearGradient id="warmWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE3D2"/>
      <stop offset="60%" stop-color="#D5CBB5"/>
      <stop offset="100%" stop-color="#BEB29A"/>
    </linearGradient>

    <!-- Ceiling Cove Light Glow -->
    <linearGradient id="coveGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EAE3D2" stop-opacity="0"/>
    </linearGradient>

    <!-- Balcony View Sunset Sky -->
    <linearGradient id="balconySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B5A75"/>
      <stop offset="40%" stop-color="#9C7789"/>
      <stop offset="80%" stop-color="#E09B74"/>
      <stop offset="100%" stop-color="#F7C88D"/>
    </linearGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="1000" height="750" fill="url(#warmWall)"/>

  <!-- Ceiling Recessed Lights -->
  <rect x="60" y="40" width="880" height="40" rx="8" fill="#FFF5DF" opacity="0.8"/>
  <rect x="80" y="55" width="840" height="200" fill="url(#coveGlow)"/>

  <!-- Floor-to-Ceiling Balcony Sliding Glass Doors (Center-Left) -->
  <rect x="60" y="100" width="460" height="520" fill="url(#balconySky)"/>
  
  <!-- Balcony Skyline Towers View -->
  <g fill="#213E37" opacity="0.7">
    <rect x="100" y="320" width="70" height="300"/>
    <rect x="190" y="260" width="90" height="360"/>
    <rect x="300" y="300" width="80" height="320"/>
    <rect x="400" y="350" width="90" height="270"/>
  </g>

  <!-- Glass Door Metal Frames -->
  <rect x="55" y="95" width="470" height="530" fill="none" stroke="#2B3632" stroke-width="8"/>
  <line x1="210" y1="95" x2="210" y2="625" stroke="#2B3632" stroke-width="6"/>
  <line x1="365" y1="95" x2="365" y2="625" stroke="#2B3632" stroke-width="6"/>

  <!-- Drapes / Curtains -->
  <path d="M40,95 Q70,360 55,625 L10,625 L10,95 Z" fill="#998A78" opacity="0.9"/>
  <path d="M525,95 Q500,360 535,625 L560,625 L560,95 Z" fill="#998A78" opacity="0.8"/>

  <!-- Wooden Parquet Floor -->
  <polygon points="0,620 1000,620 1000,750 0,750" fill="#755E46"/>
  <path d="M0,640 L1000,640 M0,680 L1000,680 M0,720 L1000,720" stroke="#5E4B37" stroke-width="2"/>

  <!-- Luxurious Sofa (Right Center) -->
  <rect x="520" y="470" width="400" height="150" rx="20" fill="#525E59"/>
  <rect x="500" y="440" width="50" height="180" rx="15" fill="#3D4743"/>
  <rect x="890" y="440" width="50" height="180" rx="15" fill="#3D4743"/>
  <!-- Plush Cushions -->
  <rect x="550" y="460" width="160" height="80" rx="12" fill="#808C86"/>
  <rect x="720" y="460" width="160" height="80" rx="12" fill="#808C86"/>
  <rect x="680" y="450" width="60" height="60" rx="8" fill="#C89B3C"/>

  <!-- Modern Coffee Table -->
  <rect x="360" y="580" width="240" height="60" rx="10" fill="#2B2620"/>
  <line x1="400" y1="640" x2="390" y2="690" stroke="#1A1714" stroke-width="6"/>
  <line x1="560" y1="640" x2="570" y2="690" stroke="#1A1714" stroke-width="6"/>

  <!-- Decorative Monstera Plant (Left) -->
  <path d="M80,680 Q75,560 60,480" stroke="#0B4A38" stroke-width="8"/>
  <circle cx="50" cy="460" r="35" fill="#0B4A38"/>
  <circle cx="85" cy="480" r="30" fill="#0B4A38"/>
  <circle cx="40" cy="520" r="28" fill="#063C2D"/>
  <rect x="55" y="650" width="50" height="60" rx="6" fill="#D9CEBA"/>

  <!-- Art Canvas Frame on Back Right Wall -->
  <rect x="640" y="160" width="260" height="220" rx="4" fill="#F0EAE1" stroke="#3A3026" stroke-width="8"/>
  <path d="M680,320 C720,240 800,360 860,260" fill="none" stroke="#063C2D" stroke-width="4"/>
  <circle cx="780" cy="220" r="25" fill="#C89B3C" opacity="0.7"/>

  <!-- Ceiling Designer Chandelier Pendant -->
  <line x1="770" y1="40" x2="770" y2="120" stroke="#C89B3C" stroke-width="3"/>
  <circle cx="770" cy="130" r="18" fill="#FFEAA5"/>
</svg>
